name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (lockfile-strict)
        run: npm ci
      - name: Typecheck (tsc --noEmit, strict; covers src/test/eval/scripts)
        run: npm run typecheck
      - name: Unit tests (node:test, no API key required)
        run: npm test
